<script>
var BUNDLED={"schema": 1, "updatedAt": "2026-10-10T11:51:11+08:00", "generated": "2026-10-10 11:51", "categories": ["01-AI-Agent开发", "02-大模型与RAG", "03-AI工具与应用", "04-视频与内容创作", "05-FDE与落地", "06-面试与职业", "99-收件箱"], "notes": [{"id": "f019ccb659e5", "title": "大模型、检索链与评测知识点详解", "date": "2026-10-10", "category": "02-大模型与RAG", "tags": ["开源模型", "提示词", "SFT", "LoRA", "embedding", "向量库", "检索", "rerank", "评测", "F1", "回归测试"], "source": "对话整理（Niceo-Tec）", "status": "已整理", "path": "02-大模型与RAG/2026-10-10_大模型-检索链-评测知识点详解.md", "body": "\n# 大模型、检索链与评测知识点详解\n\n> 主线：**模型本身（选型 / 提示词 / 微调）→ 检索链（embedding / 向量库 / 召回 / rerank）→ 评测（测试集 / 指标 / 回归）**。\n> 说明：文中数字标「经验值 / 估算」的只能当起点，具体以你的数据和压测为准；标「示例数据」的算例是编的，只用来演示公式。\n\n---\n\n## 第一部分：大模型本身\n\n### 1.1 开源模型选型\n\n**概念**：在 Qwen、DeepSeek、Llama、GLM、Mistral 等开源家族里，按业务约束选一个「够用、跑得起、能商用」的模型。\n\n**为什么重要**：选型决定了效果上限、推理成本、能否私有化部署和合规风险。选错了，后面的提示词和微调都是在补窟窿。\n\n**选型维度**\n\n| 维度 | 看什么 | 备注 |\n|---|---|---|\n| 参数量 / 激活参数 | Dense 模型：总参数 = 计算参数；MoE 模型：总参数大，每个 token 只激活一部分 | MoE **算力**按激活参数算，但**显存**通常要装下全部参数 |\n| 上下文长度 | 标称窗口 vs 实际长文效果 | 标称支持长上下文不等于长文里找信息就准，要自己测 |\n| 中文能力 | 中文语料占比、中文评测、实际业务样本试跑 | Qwen、GLM、DeepSeek 中文通常更强；Llama、Mistral 偏英文，需验证 |\n| 许可证 | Apache-2.0 / MIT 较宽松；部分模型有自定义许可（如 Llama 社区许可有附加条款） | **以官方 LICENSE 原文为准**，商用前过法务 |\n| 推理成本 | 显存、吞吐、延迟、单位 token 成本 | 见下方估算 |\n| 生态 | 工具调用 / 结构化输出支持，部署框架和微调工具是否适配 | |\n\n**显存估算（经验值 / 估算）**\n\n- 权重显存 ≈ 参数量 × 每参数字节数\n  - FP16 / BF16：2 字节 → **7B ≈ 14 GB**\n  - INT8：1 字节 → 7B ≈ 7 GB\n  - INT4：0.5 字节 → 7B ≈ 3.5～4 GB\n- 还要另加 **KV Cache**（随上下文长度 × 并发数线性增长）和框架开销，实际一般留出 **20%～50% 余量**（经验值）。\n- 长上下文、高并发场景，KV Cache 可能比权重本身还大。\n\n**量化**：INT8 质量损失通常很小；INT4（GPTQ、AWQ、GGUF Q4 等格式）显存省得多，但在复杂推理、代码、数学上可能掉点，要用自己的评测集验证。\n\n**部署框架**\n\n| 框架 | 定位 |\n|---|---|\n| vLLM | 生产 GPU 推理主流，PagedAttention、连续批处理、OpenAI 兼容 API |\n| SGLang | 高吞吐推理，前缀缓存（RadixAttention）、结构化输出做得好 |\n| llama.cpp | C/C++，GGUF 量化，CPU / Mac / 边缘设备 |\n| Ollama | 基于 llama.cpp 的一键本地运行，适合开发和体验，不适合高并发生产 |\n\n**实践步骤**：列硬约束（许可证、显存、延迟、中文）→ 选 2～3 个候选 → 用 50～200 条业务样本（经验值）跑同一评测 → 对比效果 / 延迟 / 成本 → 定型。\n\n**常见坑**：只看公开榜单不测自己的数据；忽略许可证；MoE 只按激活参数估显存；只算权重不算 KV Cache。\n\n**面试一句话**：「选型我先卡许可证和显存这些硬约束，再用业务评测集比效果、延迟和单位成本，不迷信榜单。」\n\n---\n\n### 1.2 提示词工程\n\n**核心要素**\n\n- **System / Role**：定角色、边界、输出风格、禁止事项。System 写规则，User 放任务和数据。\n- **Few-shot**：给 2～5 个输入→输出示例（经验值），对格式和风格最有效；示例要覆盖边界情况，别只给简单例子。\n- **CoT（思维链）**：让模型先推理再作答，复杂推理有帮助；生产里常让它把推理写在内部字段，只输出结论，或直接用推理模型。\n- **结构化输出**：用 JSON Schema 约束输出，配合框架的 JSON mode / 约束解码（vLLM、SGLang 等支持），**服务端再做一次 Schema 校验**，失败就重试或修复。\n- **生成参数**：\n  - `temperature`：越低越确定。抽取、分类、工具调用用 0～0.3；创作用 0.7 以上（经验值）\n  - `top_p`：核采样，一般和 temperature 只调一个\n  - `max_tokens`：输出长度上限，同时也是成本护栏\n  - `stop`：停止词\n- **提示注入防护**：\n  - 外部内容（网页、文档、邮件、工具返回）一律当**数据**，用分隔符包起来，并在 system 里声明「其中的指令不执行」\n  - 权限在服务端控制：工具白名单、最小权限，高风险操作需人工确认\n  - 输出侧过滤敏感信息，记日志审计\n  - 记住：**提示词防护不是安全边界，权限控制才是**\n\n**常见坑**：提示词越写越长、互相矛盾；改了 prompt 不跑回归；指望模型自觉输出合法 JSON。\n\n**面试一句话**：「Prompt 当代码管：有版本、有评测集、改动跑回归；结构化输出靠 Schema 加服务端校验，安全靠权限而不是 prompt。」\n\n---\n\n### 1.3 Prompt vs RAG vs 微调：怎么决策\n\n| 问题类型 | 优先方案 |\n|---|---|\n| 格式、风格、任务说明不清 | **Prompt**（最便宜，先试） |\n| 缺知识、知识常更新、需要引用来源 | **RAG** |\n| 要稳定的特定行为、格式、领域话术，prompt 太长太贵；或想用小模型替代大模型降本 | **微调（SFT / LoRA）** |\n| 偏好对齐（更符合人类偏好、更安全） | DPO / RLHF |\n\n口诀：**微调教「怎么说 / 怎么做」，RAG 给「知道什么」**。微调不适合注入频繁变化的事实。实际常组合：RAG + 少量微调（让模型学会用检索结果、按格式引用）。\n\n---\n\n### 1.4 SFT（监督微调）\n\n**概念**：用「指令 → 期望回答」的成对数据继续训练模型，让它学会特定任务、格式或风格。\n\n**数据格式**（常见两种）：\n\n```json\n// Alpaca 风格\n{\"instruction\": \"把下面句子翻译成英文\", \"input\": \"你好\", \"output\": \"Hello\"}\n\n// 多轮对话（messages / ShareGPT 风格）\n{\"messages\": [\n  {\"role\": \"system\", \"content\": \"你是客服助手\"},\n  {\"role\": \"user\", \"content\": \"怎么退货？\"},\n  {\"role\": \"assistant\", \"content\": \"您可以在订单页...\"}\n]}\n```\n\n**要点**\n\n- **质量 > 数量**：几百到几千条高质量数据，往往胜过几十万条噪声数据（经验值，取决于任务）。\n- **数据清洗**：去重（含近似去重）、去掉错误和有害回答、统一风格、覆盖长尾和拒答场景、脱敏、**剔除与评测集重叠的样本**。\n- **Chat template**：训练和推理必须使用**同一个**对话模板（特殊 token、角色标记），否则效果会明显变差。用 tokenizer 自带的 `apply_chat_template`。\n- **只对回答算 loss**：通常 mask 掉 prompt 部分，只学 assistant 输出。\n- **过拟合**：训练 loss 一直降、验证集指标反而变差 → 减 epoch（常见 1～3，经验值）、加数据、早停。\n- **灾难性遗忘**：微调后通用能力下降 → 混入一部分通用数据、用 LoRA、降低学习率；同时要评测通用能力，不只看目标任务。\n\n**面试一句话**：「SFT 的关键在数据：质量优先、清洗去重、模板对齐、和评测集隔离，并且同时盯目标任务和通用能力两边的指标。」\n\n---\n\n### 1.5 LoRA / QLoRA\n\n**原理**：冻结原权重 $W$，只训练一个低秩增量：\n\n$$W' = W + \\Delta W = W + \\frac{\\alpha}{r} BA,\\quad B\\in\\mathbb{R}^{d\\times r},\\ A\\in\\mathbb{R}^{r\\times k},\\ r \\ll \\min(d,k)$$\n\n- 可训练参数从 $d\\times k$ 降到 $r\\times(d+k)$。例如 $d=k=4096, r=8$：约 1677 万 → 约 6.6 万（只是单个矩阵的算例）。\n- 初始化时 $B=0$，训练开始时 $\\Delta W=0$，不破坏原模型。\n\n**关键超参**\n\n- `r`（rank）：常见 8 / 16 / 64（经验值），任务越复杂可适当加大\n- `lora_alpha`：缩放系数，常设为 r 或 2r（经验值）\n- `target_modules`：作用在哪些层。只加 `q_proj, v_proj` 最省；加到全部线性层（q / k / v / o / gate / up / down）效果通常更好\n- `lora_dropout`、学习率：LoRA 学习率一般比全参微调大（常见 1e-4～2e-4 量级，经验值）\n\n**显存优势**：不存全量梯度和优化器状态。**QLoRA** = 基座模型 4-bit 量化（NF4）+ LoRA 适配器用高精度训练，让单张消费级显卡也能微调 7B 级模型（具体显存依序列长度和 batch 而定）。\n\n**工具**：Hugging Face **PEFT**（底层库）、**LLaMA-Factory**（配置化 / WebUI，支持模型多）、**Unsloth**（单卡加速、省显存）。\n\n**合并权重**：训练完可以 `merge_and_unload()` 把 $BA$ 合进 $W$，部署时就没有额外延迟；也可以不合并，一个基座挂多个 LoRA（vLLM 支持多 LoRA 服务）。注意：合并到量化基座时有精度问题，一般合并到 FP16 基座上再量化。\n\n**常见坑**：rank 越大不一定越好；target_modules 太少导致效果不足；推理时忘了加载适配器，或模板不一致。\n\n**面试一句话**：「LoRA 冻结原权重，只训低秩矩阵 BA，参数和显存省一到两个数量级；QLoRA 再把基座量化到 4bit；部署可以合并权重，也可以多适配器热切换。」\n\n### 1.6 DPO / RLHF 的位置\n\n训练流程通常是：**预训练 → SFT → 偏好对齐**。\n- **RLHF**：训练奖励模型，再用 PPO 等强化学习方法优化，流程复杂、成本高。\n- **DPO**：直接用「同一问题的好回答 / 差回答」偏好对来优化，不需要单独的奖励模型，工程上简单得多。\n- 应用开发一般做到 SFT / LoRA 就够了；有明确的偏好数据（比如用户点赞 / 点踩）时再考虑 DPO。\n\n---\n\n## 第二部分：检索链\n\n### 2.0 全链路图\n\n\n![流程图 1](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACUAAAAHuCAIAAADbJ6MmAAAQAElEQVR4nOzdB1wUx9/H8aE3BUQRCwoi9t41sfcWNfYee+y9xdh7jybGbmLvGmOMvXeNGnsDERUVsYEUkfr8YPPc/wKIoGhAPu/Xee7tzu0Vbu9257szYxwZGakAAAAAAAAAAAAAJA+GCgAAAAAAAAAAAECyQYAHAAAAAAAAAAAAJCMEeAAAAAAAAAAAAEAyQoAHAAAAAAAAAAAAJCMEeAAAAAAAAAAAAEAyQoAHAAAAAAAAAAAAJCMEeAAAAAAAAAAAAEAyYqyAZO/ixVnPn19SAAAAAAAAAAAAyZWdXcFixYaqpECAhxTA3/+unV12B4dCCgAAAAAAAAAAIPnx8bnu5+ehkggBHlIGW9scWbKUVgAAAAAAAAA AAAAWhAAPAAAAAAAAAAAAsCAEeAAAAAAAAAAAAIAFIcADAAAAAAAAAAAALAgBHgAAAAAAAAAAAGBBCPAAAAAAAAAAAAAAC0KABwAAAAAAAAAAAFgQAjwAAAAAAAAAAADAghDgAQAAAAAAAAAAABaEAA8AAAAAAAAAAACwIAR4AAAAAAAAAAAAgAUhwAMAAAAAAAAAAAAsCAEeAAAAAAAAAAAAYEEI8AAAAAAAAAAAAAALQoAHAAAAAAAAAAAAWBACPAAAAAAAAAAAAMCCEOABAAAAAAAAAAAAFoQADwAAAAAAAAAAALAgBHgAAAAAAAAAAACABSHAAwAAAAAAAAAAACwIAR4AAAAAAAAAAABgQQjwAAAAAAAAAAAAAAtCgAcAAAAAAAAAAABYEAI8AAAAAAAAAAAAwIIQ4AEAAAAAAAAAAAAWhAAPAAAAAAAAAAAAsCAEeAAAAAAAAAAAAIAFIcADAAAAAAAAAAAALAgBHgAAAAAAAAAAAGBBCPAAAAAAAAAAAAAAC2Jzl9tu3TqZlZWpAAAAAAAFWkzMJb0+QAEAAAAALMMdAzxPz4rR0ScTE/cpAAAAAEABp/PxCVYAAAAAAMugMxgMCgAAAAAAAAAAAIBlYA08AAAAAAAAAAAAwIIQ4AEAAAAAAAAAAAAWhAAPAAAAAAAAAAAAsCAEeAAAAAAAAAAAAIAFIcADAAAAAAAAAAAALAgBHgAAAAAAAAAAAGBBCPAAAAAAAAAAAAAAC0KABwAAAAAAAAAAAFgQAjwAAAAAAAAAAADAghDgAQAAAAAAAAAAABaEAA8AAAAAAAAAAACwIP8HAAD//6Gcre4AAAAGSURBVAMALNQCaKdZbewAAAAASUVORK5CYII=)\n\n\n### 2.1 Embedding 模型\n\n**原理**：把文本编码成固定维度的稠密向量，语义相近的文本在向量空间里距离近。通常是 Transformer 编码器（bi-encoder）加池化，用对比学习训练（正样本拉近、负样本推远）。\n\n**常见模型**：\n- **bge 系列**（BAAI，如 bge-m3，支持多语言，能同时输出稠密 / 稀疏 / 多向量表示）\n- **gte 系列**（阿里）\n- **Qwen3-Embedding**（通义）\n- **OpenAI text-embedding-3-small / -large**（API，支持缩减输出维度）\n- 维度常见 384 / 768 / 1024 / 1536 / 3072。维度越高，存储和计算越贵，但效果不一定更好\n\n**选型要点**：\n- 中英文匹配：中文业务选中文或多语言模型\n- 领域匹配：法律、医疗、代码等领域要用自己的数据测；必要时用业务问答对微调 embedding\n- 最大输入长度：超长部分会被截断\n- 部分模型要求给 query 加指令前缀（如「为这个句子生成表示以用于检索」），**按模型卡要求做**，不加会掉点\n\n**归一化与相似度**：向量做 L2 归一化后，**余弦相似度 = 内积**，向量库直接用内积（IP）计算更快。建库和查询必须用**同一个模型、同一种处理方式**。**换模型 = 全量重建索引**。\n\n### 2.2 向量库\n\n| 产品 | 特点 |\n|---|---|\n| Milvus | 分布式、海量数据、索引类型全 |\n| Qdrant | Rust 实现，元数据过滤强，部署简单 |\n| pgvector | Postgres 扩展，和业务数据同库，适合中小规模、事务一致 |\n| Chroma | 轻量，原型和本地开发 |\n| Elasticsearch / OpenSearch | 成熟的 BM25 全文检索 + 向量（kNN），做混合检索方便 |\n\n**索引类型（ANN 近似最近邻）**\n\n- **Flat**：暴力检索，召回 100%，适合小数据或作为评测基准\n- **HNSW**：多层图，召回高、速度快，**内存占用大**；参数 `M`、`efConstruction`（建图），`ef`（查询，越大越准越慢）\n- **IVF**：先聚类分桶，只查最近的 `nprobe` 个桶；内存比 HNSW 省，召回依赖 nprobe\n- **PQ（乘积量化）**：压缩向量，大幅省内存，有精度损失；常和 IVF 组合成 IVF-PQ\n\n**权衡**：召回率 ↔ 速度 ↔ 内存，三者不能兼得。用 Flat 的结果作为真值，测 ANN 的召回率来调参。\n\n**元数据过滤**：按租户、权限、时间、文档类型过滤。注意**先过滤还是后过滤**：后过滤可能导致 Top-K 被过滤到不足 K 条；过滤条件很严时要用支持过滤感知检索的库或调大候选数。**权限过滤必须在检索层做**，不能交给 LLM。\n\n### 2.3 切块（Chunking）\n\n- 起点（经验值）：中文每块约 300～800 字，重叠 10%～20%\n- 按结构切优于按固定长度切：标题 / 段落 / 条款 / 问答对 / 代码函数\n- 每块带元数据：文档 ID、版本、标题路径、页码、权限\n- 进阶：小块检索、返回大块（parent-child）；给块加上标题或文档摘要作为上下文\n- 坑：表格被切断、标题和正文分家、块太小导致语义不完整\n\n### 2.4 检索方式\n\n- **稠密检索**：用 embedding 向量检索，擅长同义、语义匹配；对专有名词、编号、精确词较弱\n- **稀疏检索 BM25**：关键词加权（词频 TF、逆文档频率 IDF、文档长度归一化），擅长精确匹配（型号、人名、错误码）；中文要先分词\n- **混合检索 + RRF 融合**：两路各自召回，用排名融合，不需要对齐两路分数的量纲：\n\n$$\\text{RRF}(d)=\\sum_{i}\\frac{1}{k+\\text{rank}_i(d)},\\quad k\\ \\text{常取}\\ 60$$\n\n- **Query 改写**：补全指代（多轮对话里的「它」）、纠错、拆成子问题、扩展同义词\n- **HyDE**：先让 LLM 写一个「假设答案」，用假设答案的向量去检索（假设答案和文档在表述上更接近），代价是多一次 LLM 调用、多一些延迟\n- **多路召回**：多个改写 query、多索引、多种检索方式并行召回，再去重融合\n\n### 2.5 召回与 Top-K 取舍\n\n- K 小：漏召回；K 大：噪声多、rerank 更慢、上下文更贵\n- 常见做法：粗召回 K=20～100，rerank 后取 3～10 条送给 LLM（经验值）\n- 用评测集画 Recall@K 曲线，找出收益变平的拐点；也可以设相似度阈值，但不同模型的分数分布不同，阈值要单独标定\n\n### 2.6 Rerank（重排）\n\n- **Bi-encoder**（embedding 用的）：query 和文档分别编码，文档向量可以离线算好 → 快，适合海量粗召回\n- **Cross-encoder**（reranker）：query 和文档拼在一起输入模型，直接输出相关性分数 → 准，但每个候选都要实时推理 → 慢，只适合对少量候选精排\n- 模型：bge-reranker（v2-m3 等）、Qwen3-Reranker、Cohere Rerank（API）等\n- **典型做法：召回 50 → 精排取 5**（经验值）\n- 成本：延迟和候选数大致线性相关，要控制候选数、批量推理、用 GPU；也可以用 LLM 做重排，更准但更贵\n\n**检索链面试一句话**：「混合检索保召回（稠密管语义、BM25 管精确词，用 RRF 融合），cross-encoder 精排保精度，权限在检索层过滤；每一环都有单独的指标，知识库有答案却答不出时，先查检索层再查模型。」\n\n---\n\n## 第三部分：评测\n\n### 3.1 测试集怎么切\n\n- **train / dev / test**：训练用 train，调参和选 prompt 用 dev，**test 只在最终评估时用**；常见比例 8:1:1 或 7:1.5:1.5（经验值）。只做 RAG / Prompt 不训练时，至少要分 dev（日常迭代）和 held-out test（留出集，防止对着同一批题反复调参而过拟合）。\n- **分层抽样**：按类别、难度、意图、文档来源分层，保证各类比例和真实流量一致，长尾类别不能缺。\n- **按时间切防泄漏**：有时间属性的数据（工单、新闻），用较早的数据训练 / 调参，较晚的数据测试，模拟上线后的真实情况。\n- **避免重叠**：测试题不能出现在 SFT 训练数据里；近似重复也要去掉；RAG 测试要确认答案确实在知识库中（或者专门设计「知识库里没有答案、应该拒答」的题）。\n- **Golden set 规模（经验值）**：起步 50～100 条，覆盖核心场景；稳定期 200～500 条以上；每个关键类别至少几十条，否则波动太大。\n- **Bad case 回流**：线上失败案例 → 标注 → 加入评测集（注意别全塞进 test，导致分布偏移），持续扩充。\n\n### 3.2 分类指标：准确率、精确率、召回率、F1\n\n混淆矩阵：TP（真正例）、FP（假正例）、FN（假负例）、TN（真负例）。\n\n$$\\text{Accuracy}=\\frac{TP+TN}{TP+FP+FN+TN}$$\n\n$$\\text{Precision}=\\frac{TP}{TP+FP}\\qquad \\text{Recall}=\\frac{TP}{TP+FN}$$\n\n$$F1=\\frac{2\\cdot P\\cdot R}{P+R}$$\n\n**算例（示例数据）**：100 条样本，判断「是否投诉」，TP=40, FP=10, FN=20, TN=30。\n\n- Accuracy = (40+30)/100 = **0.70**\n- Precision = 40/(40+10) = **0.80**\n- Recall = 40/(40+20) ≈ **0.667**\n- F1 = 2×0.80×0.667/(0.80+0.667) ≈ 1.067/1.467 ≈ **0.727**\n\n**为什么不能只看准确率**：类别不平衡时会失真。比如 95% 都是负样本，模型全猜「负」也能得到 95% 准确率，但召回率是 0。\n\n**宏平均 vs 微平均（多分类）**\n- **宏平均（Macro）**：每个类别单独算 P / R / F1，再简单平均 → 每类权重相同，**能反映小类表现**\n- **微平均（Micro）**：所有类别的 TP / FP / FN 加总后再算 → 被大类主导；单标签多分类时 Micro-F1 = Accuracy\n- 业务上小类重要（如罕见故障）时看 Macro；关心整体量时看 Micro；最好两个都报\n\n### 3.3 检索指标\n\n设每个 query 有已标注的相关文档集合。\n\n- **Hit@K**：Top-K 里至少命中一条相关文档的 query 比例\n- **Recall@K**：$\\dfrac{|\\text{Top-K} \\cap \\text{相关集}|}{|\\text{相关集}|}$，再对所有 query 求平均\n- **MRR**：$\\text{MRR}=\\dfrac{1}{|Q|}\\sum_{q}\\dfrac{1}{\\text{rank}_q}$，rank 是第一个相关文档的位置，没命中记 0\n- **nDCG@K**：考虑分级相关性和位置折损：\n\n$$\\text{DCG@K}=\\sum_{i=1}^{K}\\frac{rel_i}{\\log_2(i+1)},\\qquad \\text{nDCG@K}=\\frac{\\text{DCG@K}}{\\text{IDCG@K}}$$\n\n（另一种常见写法的分子是 $2^{rel_i}-1$，报告时要注明用的是哪种。）\n\n**算例（示例数据）**\n- MRR：3 个 query，第一个相关文档分别排在第 1、第 3、未命中 → (1 + 1/3 + 0)/3 ≈ **0.444**\n- Recall@5：某 query 有 4 条相关文档，Top-5 命中 3 条 → **0.75**\n- nDCG@3：返回结果的相关度依次为 [2, 0, 1]\n  - DCG = 2/log₂2 + 0/log₂3 + 1/log₂4 = 2 + 0 + 0.5 = **2.5**\n  - 理想排序 [2, 1, 0]：IDCG = 2 + 1/log₂3 ≈ 2 + 0.631 = **2.631**\n  - nDCG ≈ 2.5 / 2.631 ≈ **0.950**\n\n### 3.4 生成质量\n\n- **忠实度（Faithfulness）**：回答里的陈述是否都能被检索到的上下文支持（衡量幻觉）\n- **答案相关性 / 正确性**：是否回答了问题，和参考答案是否一致\n- **引用正确率**：引用的片段是否真的支持对应的陈述\n- **LLM-as-judge**：用强模型按评分标准打分，便宜、可规模化。已知偏差有：\n  - 位置偏差（倾向于前面或后面的答案）→ 交换顺序各评一次\n  - 冗长偏差（偏好更长的答案）\n  - 自我偏好（偏好同家族模型的输出）\n  - 应对：评分标准写细、给参考答案、用 temperature 0、定期和人工标注校准一致性\n- **人工抽检**：每个版本抽一定比例（比如几十条，经验值）人工复核，尤其是高风险场景\n- **框架**：RAGAS（faithfulness、answer relevancy、context precision / recall 等）、TruLens、DeepEval、promptfoo（prompt 回归）、LangSmith / Langfuse（Trace + 评测）\n\n### 3.5 回归测试怎么跑\n\n1. **固定评测集并做版本管理**（如 `eval_v3.jsonl`），评测集一改，之前的分数就不能直接比较\n2. **记录完整配置**：模型及版本、prompt 版本（hash）、temperature 等参数、embedding / reranker 版本、chunk 参数、索引版本、知识库快照\n3. **单变量改动**：一次只改一个因素，否则不知道是哪个改动起的作用\n4. **基线对比表**：\n\n| 版本 | 改动 | Recall@5 | 忠实度 | 准确率 | P95 延迟 | 单次成本 |\n|---|---|---|---|---|---|---|\n| baseline | — | … | … | … | … | … |\n| v2 | 加 rerank | … | … | … | … | … |\n\n5. **阈值门禁**：核心指标不能低于基线超过 x 个点，关键类别不能退化，延迟和成本不能超预算 → 不满足就不合并\n6. **接入 CI**：改 prompt / 配置 / 代码就自动跑评测，并输出和基线的差异以及新失败的 case 列表\n7. **成本和延迟一起记**：效果涨了 1 个点但成本翻倍，不一定值得\n8. **显著性与样本量**：100 条题里 1～2 个点的波动可能只是噪声；LLM 输出本身有随机性，可以多跑几次取均值，或用 bootstrap 估计置信区间、做配对比较；样本太少时别下结论\n9. **逐条看 diff**：除了看总分，要看哪些 case 由对变错、哪些由错变对\n\n**评测面试一句话**：「我有固定版本的 golden set，分层覆盖各类场景，并做了防泄漏；检索层看 Recall@K / MRR，生成层看忠实度和准确率；每次只改一个变量，CI 自动和基线对比，带阈值门禁，成本和延迟一起记录。」\n\n---\n\n## 面试自查清单\n\n- [ ] 能说出 7B 模型 FP16 / INT8 / INT4 的大致显存，以及 KV Cache 为什么也要算\n- [ ] 能解释 MoE 的总参数和激活参数，说清对显存和算力分别有什么影响\n- [ ] 能对比 vLLM / SGLang / llama.cpp / Ollama 的适用场景\n- [ ] 能讲清什么时候用 Prompt、什么时候用 RAG、什么时候微调\n- [ ] 知道结构化输出怎么保证（Schema + 约束解码 + 服务端校验），能讲提示注入防护\n- [ ] SFT：数据格式、清洗、chat template 一致、过拟合与灾难性遗忘的应对\n- [ ] LoRA：写出 W + (α/r)·BA，解释 rank / alpha / target_modules，知道 QLoRA 和合并权重\n- [ ] 知道 DPO 和 RLHF 的区别以及它们在训练流程中的位置\n- [ ] 能解释 bi-encoder 和 cross-encoder，以及为什么要「召回 50 → 精排 5」\n- [ ] 能对比 HNSW / IVF / PQ 的取舍，讲清先过滤和后过滤的问题\n- [ ] 能写出 RRF 公式，说明混合检索为什么有效\n- [ ] 能手算 P / R / F1，解释宏平均和微平均\n- [ ] 能写出 Recall@K、MRR、nDCG 的定义并手算\n- [ ] 能讲 LLM-as-judge 的偏差和应对方法\n- [ ] 能讲一套完整的回归流程：版本、单变量、基线、门禁、CI、显著性\n\n## 学习路径（动手练习）\n\n1. **部署**：用 Ollama 本地跑一个 7B 级的 Qwen 模型；再用 vLLM 起 OpenAI 兼容服务，对比 FP16 和 INT4 的显存与速度。\n2. **提示词**：做一个信息抽取任务，用 JSON Schema 输出，准备 50 条样本，算字段级准确率，对比 zero-shot 和 few-shot。\n3. **RAG 基线**：选 bge-m3 或 Qwen3-Embedding + Qdrant / pgvector，用自己的文档建库，手工标注 50 条 query 对应的相关 chunk。\n4. **检索优化**：依次加 BM25 混合检索（RRF）、bge-reranker 精排，每一步记录 Recall@5 / MRR / 延迟，填进基线对比表。\n5. **评测**：用 RAGAS 跑忠实度，抽 20 条人工复核，看 LLM-as-judge 和人工的一致率。\n6. **微调**：用 LLaMA-Factory 或 Unsloth 对小模型做一次 QLoRA（几百条高质量数据），对比微调前后的目标任务指标和通用能力。\n7. **回归**：把以上评测写成脚本，接入 GitHub Actions，改 prompt 时自动出对比报告。\n\n## 相关\n\n- [Agent 开发面试：从 Demo 到上线](../06-面试与职业/2026-10-09_Agent开发面试-从Demo到上线.md)\n"}, {"id": "11e0421c26a3", "title": "Agent 开发面试：从 Demo 到上线", "date": "2026-10-09", "category": "06-面试与职业", "tags": ["agent", "面试", "工具调用", "幂等", "RAG", "Memory", "Trace", "生产化"], "source": "https://www.toutiao.com/w/1878540499912716/ （职业进阶社，微头条）", "status": "已整理", "path": "06-面试与职业/2026-10-09_Agent开发面试-从Demo到上线.md", "body": "\n# Agent 开发面试：从 Demo 到上线\n\n> 核心：招人不看会不会把框架跑起来，看三件事——**能不能稳定跑、出错能不能兜住、成本能不能压住。**\n\n## 一、工具调用：失败才是常态\n1. **调用前校验参数**：按 Schema 查必填、类型、范围；不合法打回模型改，不打下游。\n2. **超时有限重试**：网络抖动 / 5xx / 超时可重试，封顶 2～3 次，加指数退避和抖动。\n3. **语义错误不盲重试**：参数错、权限不足、业务拒绝 → 把错误写回观察结果，让模型修正或换工具。\n4. **副作用操作必须幂等**：下单、支付、发消息、写库带幂等键（如 `task_id + tool_name + step`），重试复用同一键。\n5. **连续失败就停**：N 次失败 → 停循环，转人工或降级；高风险操作人工确认。\n\n> 一句话：LLM 建议调什么，服务端决定允不允许调、怎么调、失败怎么收场。\n\n### 概念：幂等\n同一操作执行一次和执行多次，结果一样。例：支付超时重试时带同一幂等键，系统识别\"已付过\"，不会二次扣款。\n\n## 二、RAG：接向量库只是起点\n- **清洗**：去页眉页脚、处理表格/扫描件、去重；带版本、来源、权限元数据。\n- **切块**：无万能参数；中文起点约 300～800 字/块，重叠 10%～20%；FAQ / 政策 / 代码分策略。\n- **评测**：固定测试集，盯召回命中、答案准确、引用正确；Bad Case 单独记录，单变量调参。\n- **更新**：增量解析，旧块失效、新块入库，`doc_id + version` 管理；权限变更同步过滤。\n- **检索不到的排查链**：query 改写 → 切块 → embedding → Top-K/阈值 → 重排 → 权限过滤，最后才怪模型。\n\n## 三、Memory：存聊天记录 ≠ 有记忆\n二十轮后丢信息的三类原因：没召回到 / 摘要漏了 / 上下文塞满。\n\n分层管理：\n| 层 | 内容 |\n|---|---|\n| 当前会话状态 | 任务进度、未完成工具结果 |\n| 用户偏好 | 语言、风格、常用系统 |\n| 长期事实 | 项目约定、业务规则 |\n\n写入有条件，过期和冲突有规则。\n\n## 四、死循环、成本与可观测\n- 限制最大轮次 / 最大工具调用次数\n- 检测\"同一工具 + 等价参数\"重复调用\n- Token 与费用预算，超预算强制结束\n- 高风险操作人工确认\n- **Trace**：记录每步模型输出、工具入参出参、延迟、错误，可回放定位\n\n## 面试自查清单\n- [ ] 数据怎么处理？\n- [ ] 工具失败怎么兜底？有没有幂等？\n- [ ] Memory 怎么分层？\n- [ ] 怎么防死循环？\n- [ ] 日志、权限、成本怎么管？\n- [ ] 能否讲清：为什么这么设计 → 线上出过什么问题 → 怎么解决 → 指标是否变好（成功率、P95、单位成本、人工接管率）\n\n## 相关\n- 参考：[2026 Agent 开发工程师面试指南](https://edison-a-n.github.io/2026/05/08/agent-engineer-interview-2026/)\n- 参考：[最近在做Agent面试，我发现了很多共性的问题（牛客）](https://www.nowcoder.com/discuss/877578002748432384)\n"}]};

function valid(d){try{return !!(d&&typeof d==='object'&&Array.isArray(d.categories)&&Array.isArray(d.notes)&&d.notes.length&&typeof (d.updatedAt||d.generated)==='string'&&d.notes.every(function(n){return n&&n.title&&typeof n.body==='string'}))}catch(e){return false}}

function fetchT(url,ms){var c=new AbortController();var t=setTimeout(function(){c.abort()},ms);return fetch(url+(url.indexOf('?')>=0?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:c.signal}).then(function(r){clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).finally(function(){clearTimeout(t)})}
function stampNow(){var n=new Date();return (n.getMonth()+1)+'/'+n.getDate()+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}

  var res=await Promise.allSettled(REMOTES.map(function(pair){
    return fetchT(pair[1],8000).then(function(d){if(!valid(d))throw new Error('格式无效');return[pair[0],d]});
  }));
  b.classList.remove('spin');
  var ok=res.filter(function(r){return r.status==='fulfilled'}).map(function(r){return r.value})
    .sort(function(a,b){return stampOf(b[1]).localeCompare(stampOf(a[1]))});
  if(!ok.length){
    lastCheck='离线';renderMeta();
    if(manual)toast('无法连接更新源，继续使用'+(SRC==='内置'?'内置':'缓存')+'数据');
    return;
  }
  var n=ok[0][0], d=ok[0][1];
  lastCheck=stampNow();
  var newer=stampOf(d)>stampOf(DB)||(stampOf(d)===stampOf(DB)&&SRC==='内置');
  if(newer){
    writeCache(d,n);
    var changed=stampOf(d)!==stampOf(DB);
    SRC=n;setData(d);
    if(manual||changed)toast(changed?('已更新到 '+(d.generated||d.updatedAt)+'（'+n+'）'):'已是最新');
  }else{
    renderMeta();
    if(manual)toast('已是最新');
  }
}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hl(s,q){s=esc(s);if(!q)return s;var e=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(e,'gi'),function(x){return'<mark>'+x+'</mark>'})}
function imgTag(alt,src){
  var a=esc(alt||''),s=String(src||'');
  var safe=s.replace(/"/g,'&quot;');
  var isDiag=/^data:image\//i.test(s)||/\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(s);
  if(isDiag||/^data:/i.test(s)){
    return '<figure class="diagram"><img class="diagram" alt="'+a+'" src="'+safe+'">'+(a?'<figcaption>'+a+'</figcaption>':'')+'</figure>';
  }
  return '<img alt="'+a+'" src="'+safe+'">';
}
function inl(t){var codes=[],imgs=[];
t=t.replace(/!\[([^\]]*)\]\((data:[^)\s]+|[^)\s]+)\)/g,function(_,alt,src){imgs.push(imgTag(alt,src));return'\u0001'+(imgs.length-1)+'\u0001'});
t=t.replace(/`([^`]+)`/g,function(_,c){codes.push(c);return'\u0000'+(codes.length-1)+'\u0000'});
t=esc(t);
t=t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
.replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')
.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>').replace(/\$([^$\n]+)\$/g,'<code>$1</code>');
t=t.replace(/\u0000(\d+)\u0000/g,function(_,i){return'<code>'+esc(codes[+i])+'</code>'});
t=t.replace(/\u0001(\d+)\u0001/g,function(_,i){return imgs[+i]});
return t}
function md(src){var L=src.replace(/\r/g,'').split('\n'),o=[],i=0;
function cells(l){return l.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim()})}
while(i<L.length){var l=L[i],m;
if(/^\s*```/.test(l)){var lang=l.trim().slice(3).trim(),b=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))b.push(L[i++]);i++;
o.push('<pre>'+(lang?'<span class="lang">'+esc(lang)+(lang=='mermaid'?'（流程图源码 · 构建未渲出图）':'')+'</span>':'')+'<code>'+esc(b.join('\n'))+'</code></pre>');continue}
if(/^\s*\$\$/.test(l)){var b=[l.replace(/^\s*\$\$/,'')];if(!/\$\$\s*$/.test(b[0])||b[0].trim()===''){i++;while(i<L.length&&!/\$\$\s*$/.test(L[i]))b.push(L[i++]);if(i<L.length)b.push(L[i])}
i++;o.push('<pre class="math"><code>'+esc(b.join('\n').replace(/\$\$/g,'').trim())+'</code></pre>');continue}
if(!l.trim()){i++;continue}
if(m=l.match(/^(#{1,6})\s+(.*)/)){o.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>');i++;continue}
if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)){o.push('<hr>');i++;continue}
if(/^\s*>/.test(l)){var b=[];while(i<L.length&&/^\s*>/.test(L[i]))b.push(L[i++].replace(/^\s*>\s?/,''));o.push('<blockquote>'+md(b.join('\n'))+'</blockquote>');continue}
if(/\|/.test(l)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])&&/-/.test(L[i+1])){var h=cells(l);i+=2;var r='<div class="tw"><table><thead><tr>'+h.map(function(c){return'<th>'+inl(c)+'</th>'}).join('')+'</tr></thead><tbody>';
while(i<L.length&&/\|/.test(L[i])&&L[i].trim()){r+='<tr>'+cells(L[i]).map(function(c){return'<td>'+inl(c)+'</td>'}).join('')+'</tr>';i++}o.push(r+'</tbody></table></div>');continue}
if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){var ol=/^\s*\d/.test(l),items=[],base=l.match(/^\s*/)[0].length;
while(i<L.length){var x=L[i];if(!x.trim()){if(i+1<L.length&&/^\s*([-*+]|\d+[.)])\s+/.test(L[i+1])){i++;continue}break}
var ind=x.match(/^\s*/)[0].length;if(ind<=base&&(m=x.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))){items.push([m[2]]);i++}
else if(ind>base&&items.length){items[items.length-1].push(x.slice(Math.min(ind,base+2)));i++}else break}
o.push((ol?'<ol>':'<ul>')+items.map(function(it){var f=it[0],c='',mm=f.match(/^\[( |x|X)\]\s*(.*)/);
if(mm){f='<input type="checkbox" disabled'+(mm[1]!=' '?' checked':'')+'> '+inl(mm[2]);c=' class="task"'}else f=inl(f);
return'<li'+c+'>'+f+(it.length>1?md(it.slice(1).join('\n')):'')+'</li>'}).join('')+(ol?'</ol>':'</ul>'));continue}
var p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|\s*```|\s*>|\s*\$\$|\s*([-*+]|\d+[.)])\s+|!\[)/.test(L[i]))p.push(L[i++]);
if(!p.length&&/^!\[[^\]]*\]\([^)]+\)\s*$/.test(L[i]||'')){o.push(inl(L[i++]));continue}
if(!p.length)p.push(L[i++]);o.push('<p>'+p.map(inl).join('<br>')+'</p>')}
return o.join('\n')}
function lc(s){return String(s).toLowerCase()}
function filt(){var q=lc(S.q.trim());return DB.notes.filter(function(n){if(S.cat&&n.category!==S.cat)return false;if(S.tag&&n.tags.indexOf(S.tag)<0)return false;
if(q&&lc(n.title+' '+n.tags.join(' ')+' '+n.body).indexOf(q)<0)return false;return true})}
function snip(n,q){var b=n.body.replace(/!\[[^\]]*\]\(data:[^)]+\)/g,'[图]').replace(/[#>*`|\-]/g,' ').replace(/\s+/g,' ');if(!q)return esc(b.slice(0,80))+'…';var k=lc(b).indexOf(lc(q));if(k<0)return esc(b.slice(0,80))+'…';
var s=Math.max(0,k-30);return(s?'…':'')+hl(b.slice(s,k+q.length+50),q)+'…'}
function card(n){var q=S.q.trim();return'<div class="card" data-p="'+esc(n.path)+'"><h3>'+hl(n.title,q)+'</h3><div class="meta">'+esc(n.date)+' · '+esc(n.category)+'</div><div class="chips">'+
n.tags.map(function(t){return'<span class="chip">#'+hl(t,q)+'</span>'}).join('')+'</div><div class="snip">'+snip(n,q)+'</div></div>'}
function listHtml(){var r=filt(),f='';if(S.cat||S.tag)f='<div class="chips">'+(S.cat?'<button class="chip on" data-clr="cat">'+esc(S.cat)+' ✕</button>':'')+(S.tag?'<button class="chip on" data-clr="tag">#'+esc(S.tag)+' ✕</button>':'')+'</div>';
return f+'<div class="meta" style="margin-bottom:8px">共 '+r.length+' 篇</div>'+(r.length?r.map(card).join(''):'<div class="empty">没有匹配的笔记</div>')}
function counts(k){var c={};DB.notes.forEach(function(n){(k=='tags'?n.tags:[n.category]).forEach(function(x){c[x]=(c[x]||0)+1})});return c}
function render(){var m=document.getElementById('m'),hd=document.querySelector('header');
document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v==S.view)});
if(S.open){var n=DB.notes.filter(function(x){return x.path==S.open})[0];if(!n){S.open=null}else{
hd.style.display='none';var src=n.source||'',u=src.match(/https?:\/\/\S+/);
m.innerHTML='<button class="back" id="bk">‹ 返回</button><h1 style="font-size:23px;margin:4px 0">'+esc(n.title)+'</h1><div class="meta">'+esc(n.date)+' · '+esc(n.category)+(n.status?' · '+esc(n.status):'')+'</div><div class="chips">'+
n.tags.map(function(t){return'<button class="chip" data-tag="'+esc(t)+'">#'+esc(t)+'</button>'}).join('')+'</div>'+(src?'<div class="meta">来源：'+(u?'<a target="_blank" rel="noopener" href="'+esc(u[0])+'">'+esc(src)+'</a>':esc(src))+'</div>':'')+
'<hr><div class="md">'+md(n.body)+'</div><button class="back" id="bk2">‹ 返回列表</button>';window.scrollTo(0,0);return}}
hd.style.display='';var c;
if(S.view=='cats'&&!S.q){c=counts('cats');m.innerHTML=DB.categories.map(function(k){return'<div class="row" data-cat="'+esc(k)+'"><span>'+esc(k)+'</span><span class="cnt">'+(c[k]||0)+' ›</span></div>'}).join('')}
else if(S.view=='tags'&&!S.q){c=counts('tags');var ks=Object.keys(c).sort(function(a,b){return c[b]-c[a]||a.localeCompare(b)});
m.innerHTML='<div class="chips">'+ks.map(function(k){return'<button class="chip'+(S.tag==k?' on':'')+'" data-tag="'+esc(k)+'">#'+esc(k)+' '+c[k]+'</button>'}).join('')+'</div>'+(S.tag?listHtml():'')}
else m.innerHTML=listHtml()}
document.addEventListener('click',function(e){
var zim=e.target.closest('#zoom');
if(zim){document.getElementById('zoom').classList.remove('on');return}
var im=e.target.closest('.md img');
if(im&&im.src){var z=document.getElementById('zoom');z.querySelector('img').src=im.src;z.classList.add('on');return}
var t=e.target.closest('[data-p],[data-cat],[data-tag],[data-clr],#bk,#bk2,nav button,#rf');if(!t)return;
if(t.id=='rf'){refresh(true);return}
if(t.id=='bk'||t.id=='bk2'){history.back();return}
if(t.dataset.v){S.view=t.dataset.v;S.cat=null;if(S.view!='tags')S.tag=null;S.open=null}
else if(t.dataset.p){S.open=t.dataset.p;history.pushState({o:1},'')}
else if(t.dataset.cat){S.cat=t.dataset.cat;S.view='home'}

else if(t.dataset.clr){S[t.dataset.clr]=null}
render()});
window.addEventListener('popstate',function(){if(S.open){S.open=null;render()}});
document.getElementById('q').addEventListener('input',function(e){S.q=e.target.value;render()});

// pull to refresh
(function(){
  var py=null, PT=document.getElementById('ptr');
  window.addEventListener('touchstart',function(e){
    py=(!S.open && window.scrollY<=0)?e.touches[0].clientY:null;
  },{passive:true});

  },{passive:true});
  window.addEventListener('touchend',function(e){

  });
})();

// boot: cache > bundled, then background refresh
(function boot(){
  var cached=readCache();
  if(cached && valid(cached.data) && stampOf(cached.data)>=stampOf(BUNDLED||{})){
    SRC=cached.src||'缓存';setData(cached.data);
  }else if(valid(BUNDLED)){
    SRC='内置';setData(BUNDLED);
  }else{
    document.getElementById('m').innerHTML='<div class="empty">没有笔记数据</div>';
  }
  setTimeout(function(){refresh(false)},400);
})();
